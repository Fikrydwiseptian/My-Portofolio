                </button>

                <div className="flex flex-col">
                  <div className="max-h-[70vh] bg-slate-950 flex items-center justify-center overflow-hidden">
                    <img src={selectedImage.image} alt={selectedImage.categoryLabel} className="max-h-[70vh] w-auto object-contain" onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=800'; }} />
                  </div>
                  <div className="p-6 bg-[#0F172A] border-t border-slate-800">
                    <span className="inline-flex px-2.5 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-teal-400 text-xs font-bold uppercase mb-2">
                      {selectedImage.categoryLabel}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Project Modal */}
          {selectedProject && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={() => setSelectedProject(null)}>
              <div className="bg-[#0F172A] border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
                <button onClick={() => setSelectedProject(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-full cursor-pointer">
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
                <span className="px-2.5 py-0.5 rounded-full bg-teal-500/10 text-[10px] font-bold text-teal-400 uppercase">{selectedProject.category}</span>
                <h3 className="text-xl font-bold text-white mt-2 mb-1">{selectedProject.title}</h3>
                <p className="text-xs text-blue-400 font-semibold mb-4">{selectedProject.role}</p>

                <p className="text-xs text-slate-300 leading-relaxed mb-4 border-t border-slate-800 pt-4">{selectedProject.fullDesc}</p>
                <div className="border-t border-slate-800 pt-4 mb-4">
                  <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Ruang Lingkup & Detail Pekerjaan:</h4>
                  <ul className="space-y-1.5">
                    {selectedProject.features.map((feat, idx) => (
                      <li key={idx} className="flex items-start gap-2 text-xs text-slate-300">
                        <i data-lucide="check-circle-2" className="w-3.5 h-3.5 text-teal-400 mt-0.5 shrink-0"></i>
                        <span>{feat}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                {selectedProject.demoUrl && (
                  <div className="border-t border-slate-800 pt-4">
                    <a href={selectedProject.demoUrl} target="_blank" rel="noreferrer" className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-teal-500 to-blue-600 hover:from-teal-400 text-white font-bold text-xs flex items-center justify-center gap-2">
                      <i data-lucide="play-circle" className="w-4 h-4"></i>
                      <span>Tonton Video Proyek / Dokumentasi</span>
                    </a>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
